<svg xmlns="http://www.w3.org/2000/svg" width="820" height="130" viewBox="0 0 820 130" fill="none" role="img" aria-label="mcp-dashboard">
  <defs>
    <clipPath id="type">
      <rect x="170" y="16" height="98" width="0">
        <animate attributeName="width" calcMode="discrete" dur="6s" repeatCount="indefinite"
          values="0;45;77;108;139;170;202;233;264;295;327;358;389;420;452;483;483"
          keyTimes="0;0.035;0.07;0.105;0.14;0.175;0.21;0.245;0.28;0.315;0.35;0.385;0.42;0.455;0.49;0.525;1"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#type)">
    <text x="176" y="82" font-family="'DejaVu Sans Mono','JetBrains Mono','Consolas',monospace" font-size="52" font-weight="bold"><tspan fill="#10b981">$ </tspan><tspan fill="#a5b4fc">mcp-dashboard</tspan></text>
  </g>

  <!-- cursor de bloque: sigue el tipeo y parpadea -->
  <rect y="38" width="26" height="52" fill="#6366f1">
    <animate attributeName="x" calcMode="discrete" dur="6s" repeatCount="indefinite"
      values="176;207;239;270;301;332;364;395;426;457;489;520;551;582;614;645;645"
      keyTimes="0;0.035;0.07;0.105;0.14;0.175;0.21;0.245;0.28;0.315;0.35;0.385;0.42;0.455;0.49;0.525;1"/>
    <animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.5" dur="1.06s" repeatCount="indefinite"/>
  </rect>
</svg>
